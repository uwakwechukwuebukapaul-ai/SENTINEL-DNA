[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-dna"
version = "0.1.0"
description = "AI-native security investigation intelligence platform"
requires-python = ">=3.10"
dependencies = [
  "flask==3.0.3",
  "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
redis = [
  "redis>=5.0,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_dna = ["saas/migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    "__pycache__",
    "work",
    "*.egg-info"
]