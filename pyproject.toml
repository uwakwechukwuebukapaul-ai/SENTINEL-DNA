[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-dna"
version = "0.1.0"
description = "AI-native security investigation intelligence platform"
requires-python = ">=3.10"
dependencies = [
  "flask==3.0.3",
  "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

