<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify MFA | Sentinel DNA</title><link rel="stylesheet" href="{{ url_for('dashboard_static', filename='css/sentinel-dna-auth.css') }}"></head><body class="auth-body"><main class="auth-panel"><div class="auth-panel-head"><div class="auth-panel-brand"><span class="auth-mark" aria-hidden="true">SD</span><span>Protected analyst workspace</span></div></div><p class="auth-eyebrow">Security gate / MFA</p><h1>Verify your authenticator</h1><p class="auth-intro">Enter the current code from your authenticator app. Use a recovery code only if your authenticator is unavailable.</p><p class="auth-status" data-auth-status role="alert" aria-live="polite"></p><form data-mfa-verify-form novalidate><label class="auth-field" for="mfa-code">Authenticator code<input id="mfa-code" class="auth-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><label class="auth-field" for="mfa-recovery-code">Recovery code <span class="muted">(optional)</span><input id="mfa-recovery-code" autocomplete="off"></label><button class="auth-button" type="submit">Verify and continue</button></form></main><script src="{{ url_for('dashboard_static', filename='js/sentinel-dna-auth.js') }}" defer></script></body></html>
