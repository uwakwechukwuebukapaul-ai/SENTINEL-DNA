<!doctype html><html><head><title>AI Investigation Intelligence</title></head><body><main><h1>AI Investigation Intelligence</h1><p id="status">Loading governed intelligence…</p><section><h2>Investigation overview</h2><pre id="overview"></pre></section><section><h2>Evidence reasoning and threat assessment</h2><pre id="reasoning"></pre></section><section><h2>Investigation plan and summary</h2><pre id="plan"></pre></section></main><script>const caseId=encodeURIComponent(new URLSearchParams(location.search).get('case_id')||'current'),base='/api/investigation-intelligence/'+caseId,s=document.getElementById('status');Promise.all(['','/evidence','/assessment','/plan','/summary'].map(p=>fetch(base+p).then(r=>r.json()))).then(x=>{document.getElementById('overview').textContent=JSON.stringify(x[0],null,2);document.getElementById('reasoning').textContent=JSON.stringify([x[1],x[2]],null,2);document.getElementById('plan').textContent=JSON.stringify([x[3],x[4]],null,2);s.textContent='Governed advisory intelligence loaded.'}).catch(()=>s.textContent='Unavailable; human review required.');</script></body></html>
