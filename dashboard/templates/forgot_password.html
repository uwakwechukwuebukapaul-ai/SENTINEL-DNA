<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account recovery | Sentinel DNA</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#e7eef8;font:15px/1.5 Arial,sans-serif}main{width:min(480px,calc(100% - 32px));padding:36px;background:#0d1b2d;border:1px solid #243852;border-radius:16px}h1{color:#42a5f5}.muted{color:#91a4bd}.eyebrow{color:#7dd3fc;text-transform:uppercase;letter-spacing:.16em;font-size:11px}label{display:block;margin:16px 0 6px;color:#91a4bd}input{width:100%;padding:12px;background:#07111f;color:#e7eef8;border:1px solid #243852;border-radius:8px;box-sizing:border-box}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:#1976d2;color:white;font-weight:700;cursor:pointer}.status{min-height:24px;color:#fb7185}a{color:#b8d9ff}</style></head><body><main><p class="eyebrow">Sentinel DNA · Secure recovery</p><h1>Recover access</h1><p class="muted">Request a recovery code. For privacy, the same response is shown whether or not an account is eligible.</p><form id="recovery"><label for="email">Account email</label><input id="email" type="email" autocomplete="email" required><button type="submit">Send recovery code</button><label for="code">Recovery code</label><input id="code" inputmode="numeric" autocomplete="one-time-code"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password"><button id="reset" type="button">Set new password</button><p id="status" class="status" role="alert"></p></form><p><a href="/login">Back to sign in</a></p></main><script>const csrf=async()=>{const r=await fetch('/api/auth/csrf');return(await r.json()).csrf_token};recovery.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':await csrf()},body:JSON.stringify({email:email.value})});const d=await r.json();status.textContent=d.message||'If the account is eligible, recovery instructions have been sent.';};reset.onclick=async()=>{const r=await fetch('/api/auth/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':await csrf()},body:JSON.stringify({code:code.value,password:password.value})});status.textContent=r.ok?'Password updated. Sign in again.':'Recovery failed. Check the code and password policy.';};</script></body></html>
