<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Sentinel DNA SOC{% endblock %}</title>
  <style>
    :root{--bg:#07111f;--surface:#0c1a2b;--surface-2:#102238;--line:#203750;--text:#e8f0fa;--muted:#8fa5be;--blue:#55b7ff;--cyan:#6ee7e7;--green:#63d3a3;--amber:#f4c76b;--red:#f77f92;--purple:#a995ff;--shadow:0 18px 50px rgba(0,0,0,.22)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,#123252 0,transparent 34%),var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:#a9d9ff;text-decoration:none}a:hover{text-decoration:underline}.shell{max-width:1480px;margin:auto;padding:24px 30px 60px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:24px;border-bottom:1px solid var(--line);padding:0 0 20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;color:var(--text);font-weight:800;letter-spacing:.12em;text-transform:uppercase}.brand-mark{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--blue);color:var(--blue);border-radius:8px;font-size:12px}.context{color:var(--muted);font-size:12px}.auth-nav{display:flex;align-items:center;justify-content:flex-end;gap:15px;flex-wrap:wrap}.identity{color:var(--muted)}.auth-nav form{margin:0}.auth-nav button,.button{border:1px solid #315473;border-radius:7px;background:#12304a;color:#cceaff;padding:8px 12px;font:inherit;cursor:pointer}.auth-nav button:hover,.auth-nav button:focus-visible,.button:hover{background:#184666;text-decoration:none}.page-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow,.label{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.muted{color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(28px,4vw,48px);line-height:1.05;letter-spacing:-.035em;margin-bottom:10px}h2{font-size:18px;letter-spacing:-.01em}h3{font-size:14px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(6,minmax(130px,1fr));margin:22px 0}.columns{grid-template-columns:minmax(0,1.75fr) minmax(280px,.9fr)}.card{background:linear-gradient(145deg,rgba(16,34,56,.96),rgba(10,24,40,.96));border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}.metric{font-size:30px;font-weight:800;letter-spacing:-.04em;margin-top:8px}.metric-sub{font-size:12px;color:var(--muted);margin-top:5px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.section-head h2{margin:0}.pill,.status{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted);font-size:11px}.status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}.status.ready::before,.status.active::before,.status.completed::before{background:var(--green)}.status.high::before,.status.critical::before{background:var(--red)}.status.investigating::before{background:var(--amber)}.high,.critical{color:#ffb5c0}.medium{color:var(--amber)}.low{color:var(--green)}.button.primary{background:#1f77b4;border-color:#42a5f5;color:white}.button.subtle{background:transparent}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid rgba(32,55,80,.8);vertical-align:top}th{color:var(--muted);font-size:10px;letter-spacing:.11em;text-transform:uppercase}tbody tr:hover{background:rgba(85,183,255,.045)}.case-link{font-weight:750;color:var(--text)}.case-link:hover{color:var(--blue)}.bar-row{display:grid;grid-template-columns:100px 1fr 34px;align-items:center;gap:10px;margin:11px 0}.bar-track{height:7px;background:#172c43;border-radius:99px;overflow:hidden}.bar-fill{height:100%;min-width:2px;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px}.bar-fill.warn{background:linear-gradient(90deg,var(--amber),#f59e0b)}.bar-fill.danger{background:linear-gradient(90deg,var(--red),#ef4444)}.timeline{list-style:none;padding:0;margin:0}.timeline li{display:grid;grid-template-columns:90px 12px 1fr;gap:10px;align-items:start;padding:9px 0}.timeline .time{color:var(--muted);font-size:11px}.timeline .dot{width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(110,231,231,.1)}.empty{border:1px dashed #34516d;border-radius:9px;padding:24px;color:var(--muted);text-align:center}.notice{border-left:3px solid var(--amber);background:rgba(244,199,107,.07);padding:12px 14px;color:#e6d6a8;border-radius:0 8px 8px 0}.evidence-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.evidence-item{padding:14px;background:#0a1727;border:1px solid var(--line);border-radius:9px}.evidence-item strong{display:block;margin-bottom:5px}.sequence{display:flex;align-items:stretch;gap:8px;overflow:auto}.stage{flex:1;min-width:120px;padding:13px;border:1px solid var(--line);border-radius:8px;background:#0a1727}.stage.supported{border-color:#397c91;background:rgba(110,231,231,.08)}.stage small{display:block;color:var(--muted);text-transform:uppercase;font-size:9px;letter-spacing:.1em;margin-bottom:8px}.detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.detail-stat{padding:14px;background:#0a1727;border:1px solid var(--line);border-radius:9px}.detail-stat .value{font-size:23px;font-weight:800;margin-top:5px}.prose{white-space:pre-wrap;color:#d6e4f3}.report-section{margin-bottom:16px}.report-section pre{white-space:pre-wrap;overflow:auto;background:#091523;border:1px solid var(--line);padding:14px;border-radius:8px;color:#c8d9ea;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.footer-note{margin-top:24px;color:var(--muted);font-size:12px}@media(max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(130px,1fr))}.columns{grid-template-columns:1fr}.detail-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.shell{padding:18px 14px 40px}.topbar,.page-heading{align-items:flex-start;flex-direction:column}.auth-nav{justify-content:flex-start}.stats{grid-template-columns:repeat(2,minmax(120px,1fr))}.evidence-grid{grid-template-columns:1fr}.sequence{display:grid;grid-template-columns:1fr 1fr}.bar-row{grid-template-columns:82px 1fr 25px}}
  </style>
</head>
<body><main class="shell">
  <nav class="topbar" aria-label="Authenticated navigation">
    <a class="brand" href="/"><span class="brand-mark">SD</span><span>Sentinel DNA</span></a>
    {% if analyst %}<div class="auth-nav"><span class="identity">{{ analyst.name }} · {{ analyst.role|replace('_', ' ')|title }}</span><a href="/profile">Profile</a><a href="/workspace/">Workspace</a><form method="post" action="/api/auth/logout"><input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}"><button type="submit">Sign out</button></form></div>{% else %}<span class="context">Evidence-first SOC investigation platform</span>{% endif %}
  </nav>
  {% block content %}{% endblock %}
</main></body></html>
