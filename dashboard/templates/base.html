<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Sentinel DNA SOC{% endblock %}</title><style>
.auth-nav{display:flex;align-items:center;gap:12px}.auth-nav form{margin:0}.auth-nav button{border:1px solid var(--line);border-radius:6px;background:transparent;color:#b8d9ff;padding:7px 10px;font:inherit;cursor:pointer}.auth-nav button:hover,.auth-nav button:focus-visible{background:#123b58}.identity{color:var(--muted)}
</style></head><body><main class="shell"><nav class="nav"><a class="brand" href="/">SENTINEL DNA / SOC COMMAND CENTER</a>{% if analyst %}<div class="auth-nav" aria-label="Authenticated navigation"><span class="identity">{{ analyst.name }} · {{ analyst.role|replace('_', ' ')|title }}</span><a href="/profile">Profile</a><a href="/workspace/">Workspace</a><form method="post" action="/api/auth/logout"><input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}"><button type="submit">Sign out</button></form></div>{% else %}<span class="muted">Live SQLite evidence view</span>{% endif %}</nav>{% block content %}{% endblock %}</main></body></html>
