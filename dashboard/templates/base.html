<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Sentinel DNA SOC{% endblock %}</title><style>
:root{--bg:#07111f;--panel:#0d1b2d;--line:#243852;--text:#e7eef8;--muted:#91a4bd;--blue:#42a5f5;--red:#fb7185;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Arial,sans-serif}.shell{max-width:1440px;margin:auto;padding:24px}.nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{color:var(--blue);font-weight:800;letter-spacing:.08em}.nav a{color:#b8d9ff;text-decoration:none}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(6,minmax(120px,1fr));margin:24px 0}.columns{grid-template-columns:2fr 1fr}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}.metric{font-size:30px;font-weight:800}.label,.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:bold}.critical,.high{background:#54202d;color:#fecdd3}.medium{background:#594516;color:#fde68a}.open,.investigating,.active{background:#123b58;color:#bae6fd}.button{background:#1976d2;color:#fff!important;border:0;border-radius:6px;padding:7px 10px;text-decoration:none;font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center}ul{padding-left:20px}@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:600px){.shell{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}table{font-size:12px}.nav{align-items:flex-start;gap:8px;flex-direction:column}}
</style></head><body><main class="shell"><nav class="nav"><a class="brand" href="/">SENTINEL DNA / SOC COMMAND CENTER</a><span class="muted">Live SQLite evidence view</span></nav>{% block content %}{% endblock %}</main></body></html>
