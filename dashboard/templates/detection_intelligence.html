<!doctype html><html><head><title>{{ title }}</title></head><body><main><h1>{{ title }}</h1><p id="status">Loading advisory intelligence…</p><pre id="content"></pre></main><script>const endpoint={{ endpoint|tojson }};const s=document.getElementById('status'),c=document.getElementById('content');fetch('/api/detection-intelligence/'+endpoint).then(r=>r.json()).then(d=>{s.textContent='Advisory intelligence loaded';c.textContent=JSON.stringify(d,null,2)}).catch(()=>s.textContent='Unavailable; human review required.');</script></body></html>
