<!doctype html><html><head><title>AI SOC Copilot</title></head><body><main><h1>AI SOC Copilot</h1><p id="status">Loading governed reasoning…</p><section><h2>Investigation context and explanation</h2><pre id="context"></pre></section><section><h2>Recommendations and confidence</h2><pre id="recommendations"></pre></section></main><script>const caseId=encodeURIComponent(new URLSearchParams(location.search).get('case_id')||'current');const s=document.getElementById('status');Promise.all([fetch('/api/copilot/context/'+caseId).then(r=>r.json()),fetch('/api/copilot/reason/'+caseId).then(r=>r.json())]).then(([c,r])=>{document.getElementById('context').textContent=JSON.stringify(c,null,2);document.getElementById('recommendations').textContent=JSON.stringify(r,null,2);s.textContent='Governed advisory reasoning loaded.'}).catch(()=>{s.textContent='Copilot unavailable; human review required.'});</script></body></html>
