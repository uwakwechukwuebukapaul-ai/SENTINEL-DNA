<!doctype html><html><head><title>Sentinel DNA Production Readiness</title></head><body><main><h1>Production Readiness Center</h1><div id="summary">Loading readiness…</div><script>fetch('/api/readiness').then(r=>r.json()).then(x=>{document.getElementById('summary').innerHTML='<h2>Overall: '+x.overall_score+'% ('+(x.ready?'Ready':'Not Ready')+')</h2><h3>Category scores</h3><pre>'+JSON.stringify(x.category_scores,null,2)+'</pre><h3>Passed checks</h3><pre>'+JSON.stringify(x.passed_checks,null,2)+'</pre><h3>Failed checks and recommendations</h3><pre>'+JSON.stringify(x.failed_checks.concat(x.recommendations),null,2)+'</pre>'})</script></main></body></html>
