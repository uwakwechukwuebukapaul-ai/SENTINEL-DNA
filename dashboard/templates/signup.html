<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Create analyst account | Sentinel DNA</title>
  <style>
    :root{--bg:#07111f;--panel:#0d1b2d;--line:#243852;--text:#e7eef8;--muted:#91a4bd;--blue:#42a5f5;--red:#fda4af;--green:#4ade80}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,#123b58 0,#07111f 42%);color:var(--text);font:15px/1.5 Inter,Arial,sans-serif}
    main{width:min(560px,100%);padding:clamp(22px,5vw,36px);background:rgba(13,27,45,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 80px #0008}
    h1{margin:0;color:var(--blue);font-size:clamp(25px,4vw,32px)}.eyebrow{color:#7dd3fc;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700}
    label{display:block;margin:14px 0 6px;color:var(--muted)}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    button{padding:11px 14px;border:0;border-radius:8px;background:#1976d2;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.verify-row{display:grid;grid-template-columns:1fr auto;gap:8px}.verify-row button{margin-top:0;white-space:nowrap}.primary{width:100%;margin-top:18px}.muted{color:var(--muted)}#status{min-height:24px;margin:14px 0 0;color:var(--red)}#status.ok{color:var(--green)}a{color:#b8d9ff}.field-note{font-size:12px;color:var(--muted);margin:5px 0 0}
    @media(max-width:480px){.verify-row{grid-template-columns:1fr}.verify-row button{width:100%}}
  </style>
</head>
<body>
<main>
  <p class="eyebrow">Sentinel DNA · SOC Command Center</p>
  <h1>Create your analyst account</h1>
  <p class="muted">Verify your email to create an account. Sentinel DNA assigns your analyst role and workspace; registration never grants manager privileges.</p>
  <form id="signup-form" novalidate>
    <label for="username">Username</label>
    <input id="username" name="username" minlength="3" maxlength="64" required autocomplete="username">

    <label for="email">Email address</label>
    <input id="email" name="email" type="email" required autocomplete="email">
    <div class="verify-row" style="margin-top:8px">
      <span aria-hidden="true"></span>
      <button id="send-email" type="button">Send email code</button>
    </div>

    <label for="email-code">Email verification code</label>
    <div class="verify-row">
      <input id="email-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" aria-describedby="code-help">
      <button id="verify-email" type="button">Verify email</button>
    </div>
    <p id="code-help" class="field-note">Enter the six-digit code sent to your email address.</p>

    <label for="dob">Date of birth (optional)</label>
    <input id="dob" name="date_of_birth" type="date" autocomplete="bday">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="10" required autocomplete="new-password">
    <label for="confirm-password">Confirm password</label>
    <input id="confirm-password" name="confirm_password" type="password" minlength="10" required autocomplete="new-password">

    <p id="status" role="status" aria-live="polite"></p>
    <button id="create-account" class="primary" type="submit">Create analyst account</button>
  </form>
  <p class="muted">Already registered? <a href="/login">Sign in</a></p>
</main>
<script>
(() => {
  "use strict";
  const byId = (id) => document.getElementById(id);
  const form = byId("signup-form");
  const status = byId("status");
  const sendButton = byId("send-email");
  const verifyButton = byId("verify-email");
  const createButton = byId("create-account");
  let csrfToken = "";
  let emailChallengeId = "";
  let verifiedEmail = "";

  function showStatus(message, ok = false) {
    status.textContent = message;
    status.classList.toggle("ok", ok);
  }
  async function readJson(response) {
    try { return await response.json(); } catch (_) { return {}; }
  }
  async function postJson(path, payload) {
    if (!csrfToken) throw new Error("Refresh the page and try again.");
    const response = await fetch(path, {
      method: "POST",
      credentials: "same-origin",
      headers: {"Content-Type": "application/json", "X-CSRF-Token": csrfToken},
      body: JSON.stringify(payload)
    });
    return {response, data: await readJson(response)};
  }
  async function loadCsrf() {
    try {
      const response = await fetch("/api/auth/csrf", {credentials: "same-origin", cache: "no-store"});
      const data = await readJson(response);
      if (!response.ok || !data.csrf_token) throw new Error();
      csrfToken = data.csrf_token;
    } catch (_) {
      showStatus("Security token could not be loaded. Refresh the page and try again.");
      sendButton.disabled = verifyButton.disabled = createButton.disabled = true;
    }
  }

  byId("email").addEventListener("input", () => {
    const email = byId("email").value.trim().toLowerCase();
    if (email !== verifiedEmail) {
      emailChallengeId = "";
      verifiedEmail = "";
    }
  });

  sendButton.addEventListener("click", async () => {
    const email = byId("email").value.trim().toLowerCase();
    if (!byId("email").checkValidity()) {
      byId("email").reportValidity();
      return;
    }
    sendButton.disabled = true;
    try {
      const {response, data} = await postJson("/api/auth/email/send-registration-code", {email});
      if (response.status === 202 && data.challenge_id) {
        emailChallengeId = data.challenge_id;
        verifiedEmail = "";
        showStatus("If this address is eligible, a verification code has been sent. Check your inbox.", true);
      } else {
        emailChallengeId = "";
        verifiedEmail = "";
        showStatus("The verification service did not confirm delivery. Check your email and try again.");
      }
    } catch (_) {
      showStatus("Could not request a code. Check your connection and try again.");
    } finally {
      sendButton.disabled = false;
    }
  });

  verifyButton.addEventListener("click", async () => {
    const code = byId("email-code").value.trim();
    if (!emailChallengeId) {
      showStatus("Request an email code first.");
      return;
    }
    if (!/^[0-9]{6}$/.test(code)) {
      showStatus("Enter the six-digit verification code.");
      return;
    }
    verifyButton.disabled = true;
    try {
      const {response, data} = await postJson("/api/auth/email/verify-registration-code", {
        challenge_id: emailChallengeId, code
      });
      if (response.ok && data.verified) {
        verifiedEmail = byId("email").value.trim().toLowerCase();
        showStatus("Email verified. You can create your analyst account.", true);
      } else {
        verifiedEmail = "";
        showStatus("Verification failed or expired. Request a new code and try again.");
      }
    } catch (_) {
      showStatus("Could not verify the code. Check your connection and try again.");
    } finally {
      verifyButton.disabled = false;
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const email = byId("email").value.trim().toLowerCase();
    const username = byId("username").value.trim();
    const password = byId("password").value;
    if (!form.reportValidity()) return;
    if (password !== byId("confirm-password").value) {
      showStatus("The passwords do not match.");
      return;
    }
    if (!emailChallengeId || verifiedEmail !== email) {
      showStatus("Verify this email address before creating your account.");
      return;
    }
    createButton.disabled = true;
    try {
      const payload = {username, email, password, email_challenge_id: emailChallengeId};
      if (byId("dob").value) payload.date_of_birth = byId("dob").value;
      const {response, data} = await postJson("/api/auth/register", payload);
      if (response.status === 201) {
        showStatus("Account created. Redirecting to sign in…", true);
        window.location.assign("/login?registered=true");
      } else if (response.status === 409) {
        showStatus("An account with those details may already exist. Try signing in or use a different email/username.");
      } else if (response.status === 403 && data.error === "verification_required") {
        showStatus("Email verification expired. Request a new code and verify again.");
      } else if (data.error === "csrf_validation_failed") {
        showStatus("Your security session expired. Refresh the page and try again.");
      } else {
        showStatus("Account creation failed. Check the details and try again.");
      }
    } catch (_) {
      showStatus("Could not create the account. Check your connection and try again.");
    } finally {
      createButton.disabled = false;
    }
  });

  loadCsrf();
})();
</script>
</body>
</html>
