<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create analyst account · Sentinel DNA</title>
  <style>
    :root { --bg: #07111f; --panel: #0d1b2d; --line: #243852; --text: #e7eef8; --muted: #91a4bd; --blue: #42a5f5; --red: #fb7185; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 Arial, sans-serif; }
    main { width: min(420px, calc(100% - 32px)); padding: 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    h1 { margin-top: 0; color: var(--blue); letter-spacing: .04em; }
    label { display: block; margin: 16px 0 6px; color: var(--muted); }
    input { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
    button { width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 6px; background: #1976d2; color: white; font-weight: 700; cursor: pointer; }
    #status { min-height: 24px; margin-bottom: 0; color: var(--red); }
    a { color: #b8d9ff; }
  </style>
</head>
<body>
  <main>
    <h1>Sentinel DNA</h1>
    <p class="muted">Create an analyst account for the SOC Command Center.</p>
    <form id="signup-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required minlength="3">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="10">
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required minlength="10">
      <button type="submit">Create analyst account</button>
      <p id="status" role="alert" aria-live="polite"></p>
    </form>
    <p class="muted">Already have an account? <a href="/login">Sign in</a></p>
  </main>
  <script>
    document.getElementById('signup-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const status = document.getElementById('status');
      const password = document.getElementById('password').value;
      const confirmation = document.getElementById('confirm-password').value;
      status.textContent = '';
      if (password !== confirmation) {
        status.textContent = 'Passwords do not match.';
        return;
      }
      const csrfResponse = await fetch('/api/auth/csrf', {credentials: 'same-origin'});
      const csrf = (await csrfResponse.json()).csrf_token;
      const response = await fetch('/api/auth/register', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf},
        body: JSON.stringify({
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: password
        })
      });
      if (response.ok) {
        window.location.assign('/login?registered=true');
        return;
      }
      const body = await response.json().catch(() => ({}));
      status.textContent = response.status === 409 ? 'That username or email is already registered.' : (body.error === 'invalid_registration' ? 'Enter a valid username, email, and password.' : 'Unable to create the account.');
    });
  </script>
</body>
</html>
