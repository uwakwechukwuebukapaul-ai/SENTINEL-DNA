<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create analyst account | Sentinel DNA</title><style>:root{--bg:#07111f;--panel:#0d1b2d;--line:#243852;--text:#e7eef8;--muted:#91a4bd;--blue:#42a5f5;--red:#fb7185;--green:#4ade80}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,#123b58 0,#07111f 42%);color:var(--text);font:15px/1.5 Inter,Arial,sans-serif}main{width:min(600px,calc(100% - 32px));padding:36px;background:rgba(13,27,45,.96);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 80px #0008}h1{margin:0;color:var(--blue)}.eyebrow{color:#7dd3fc;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}label{display:block;margin:14px 0 6px;color:var(--muted)}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:#1976d2;color:white;font-weight:700;cursor:pointer}.password{position:relative}.password button{position:absolute;right:4px;top:4px;width:auto;margin:0;padding:7px;background:transparent;color:#b8d9ff}.muted{color:var(--muted)}#status{min-height:24px;color:var(--red)}.ok{color:var(--green)}a{color:#b8d9ff}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><p class="eyebrow">Sentinel DNA · SOC Command Center</p><h1>Create your analyst account</h1><p class="muted">Email and phone verification protect your analyst identity. Your role and workspace are assigned by Sentinel DNA.</p><form id="signup"><div class="grid"><div><label for="username">Username</label><input id="username" minlength="3" required autocomplete="username"></div><div><label for="email">Email</label><input id="email" type="email" required autocomplete="email"><button id="send-email" type="button">Send email code</button></div><div><label for="email-code">Email verification code</label><input id="email-code" inputmode="numeric" maxlength="6"><button id="verify-email" type="button">Verify email</button></div><div><label for="dob">Date of birth</label><input id="dob" type="date" required></div><div><label for="country">Country</label><select id="country" required><option value="">Loading countries…</option></select></div><div><label for="phone">Phone number</label><input id="phone" required autocomplete="tel"><button id="send-phone" type="button">Send phone code</button></div><div><label for="phone-code">Phone verification code</label><input id="phone-code" inputmode="numeric" maxlength="6"><button id="verify-phone" type="button">Verify phone</button></div><div><label for="password">Password</label><div class="password"><input id="password" type="password" minlength="10" required autocomplete="new-password"><button type="button" data-for="password">Show</button></div></div><div><label for="confirm">Confirm password</label><div class="password"><input id="confirm" type="password" minlength="10" required autocomplete="new-password"><button type="button" data-for="confirm">Show</button></div></div></div><p id="status" role="alert" aria-live="polite"></p><button type="submit">Create analyst account</button></form><p class="muted">Already registered? <a href="/login">Sign in</a></p></main><script>let emailChallenge='',phoneChallenge='',emailVerified=false,phoneVerified=false;const csrf=async()=>{const r=await fetch('/api/auth/csrf');return(await r.json()).csrf_token};fetch('/api/auth/countries').then(r=>r.json()).then(d=>country.innerHTML='<option value="">Select country</option>'+d.countries.map(c=>`<option value="${c.region}">${c.name} (${c.calling_code})</option>`).join(''));document.querySelectorAll('[data-for]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.for);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide'});sendEmail.onclick=async()=>{const r=await fetch('/api/auth/email/send-registration-code',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':await csrf()},body:JSON.stringify({email:email.value})});if(r.ok){emailChallenge='pending';status.textContent='If eligible, an email verification code has been sent.'}};verifyEmail.onclick=async()=>{const id=emailChallenge==='pending'?undefined:emailChallenge;const r=await fetch('/api/auth/email/verify-registration-code',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':await csrf()},body:JSON.stringify({challenge_id:id,code:emailCode.value})});emailVerified=r.ok;if(!r.ok)status.textContent='Email verification failed or expired.';else status.textContent='Email verified.'};sendPhone.onclick=async()=>{const r=await fetch('/api/auth/phone/send-code',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':await csrf()},body:JSON.stringify({country:country.value,phone:phone.value})});const d=await r.json();if(r.ok){phoneChallenge=d.challenge_id;status.textContent='Phone code sent.'}else status.textContent='Unable to send a phone code.'};verifyPhone.onclick=async()=>{const r=await fetch('/api/auth/phone/verify-code',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':await csrf()},body:JSON.stringify({challenge_id:phoneChallenge,code:phoneCode.value})});phoneVerified=r.ok;if(!r.ok)status.textContent='Phone verification failed or expired.';else status.textContent='Phone verified.'};signup.onsubmit=async e=>{e.preventDefault();if(password.value!==confirm.value){status.textContent='Passwords do not match.';return}if(!emailVerified||!phoneVerified){status.textContent='Verify both email and phone before creating the account.';return}const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':await csrf()},body:JSON.stringify({username:username.value,email:email.value,password:password.value,date_of_birth:dob.value,country:country.value,phone:phone.value,phone_challenge_id:phoneChallenge,email_challenge_id:emailChallenge})});if(r.ok)location='/login?registered=true';else status.textContent='Unable to create the account. Check the information and try again.'};</script></body></html>
