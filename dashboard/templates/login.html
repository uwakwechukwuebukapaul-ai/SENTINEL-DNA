<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Sentinel DNA</title>
  <style>
    :root { --bg: #07111f; --panel: #0d1b2d; --line: #243852; --text: #e7eef8; --muted: #91a4bd; --blue: #42a5f5; --red: #fb7185; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 Arial, sans-serif; }
    main { width: min(420px, calc(100% - 32px)); padding: 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    h1 { margin-top: 0; color: var(--blue); letter-spacing: .04em; }
    label { display: block; margin: 16px 0 6px; color: var(--muted); }
    input { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
    button { width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 6px; background: #1976d2; color: white; font-weight: 700; cursor: pointer; }
    #status { min-height: 24px; margin-bottom: 0; color: var(--red); }
  </style>
</head>
<body>
  <main>
    <h1>Sentinel DNA</h1>
    <p class="muted">Sign in to the SOC Command Center.</p>
    <p id="registered-message" class="muted" hidden>Account created. Sign in to continue.</p>
    <p id="signed-out-message" class="muted" hidden>You have been signed out.</p>
    <form id="login-form">
      <label for="username">Username or email</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p id="status" role="alert" aria-live="polite"></p>
    </form>
    <p class="muted">Don't have an account? <a href="/signup">Create one</a></p>
  </main>
  <script>
    if (new URLSearchParams(window.location.search).get('registered') === 'true') document.getElementById('registered-message').hidden = false;
    if (new URLSearchParams(window.location.search).get('signed_out') === 'true') document.getElementById('signed-out-message').hidden = false;
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const status = document.getElementById('status');
      status.textContent = '';
      const csrfResponse = await fetch('/api/auth/csrf', {credentials: 'same-origin'});
      const csrf = (await csrfResponse.json()).csrf_token;
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf},
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      if (response.ok) {
        window.location.assign('/');
        return;
      }
      status.textContent = 'Sign-in failed. Check your credentials and try again.';
    });
  </script>
</body>
</html>
