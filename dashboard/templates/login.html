<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Sentinel DNA</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#e7eef8;font:15px/1.5 Arial,sans-serif}main{width:min(480px,calc(100% - 32px));padding:36px;background:#0d1b2d;border:1px solid #243852;border-radius:16px}h1{color:#42a5f5}.muted{color:#91a4bd}.eyebrow{color:#7dd3fc;text-transform:uppercase;letter-spacing:.16em;font-size:11px}label{display:block;margin:16px 0 6px;color:#91a4bd}input{width:100%;padding:12px;background:#07111f;color:#e7eef8;border:1px solid #243852;border-radius:8px;box-sizing:border-box}button,.oauth{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:#1976d2;color:white;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:block}.oauth{background:white;color:#172033}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.password-wrap{position:relative}.password-wrap button{position:absolute;right:4px;top:4px;width:auto;margin:0;padding:8px;background:transparent;color:#b8d9ff}.status{min-height:24px;color:#fb7185}a{color:#b8d9ff}</style></head><body><main><p class="eyebrow">Sentinel DNA · SOC Command Center</p><h1>Welcome back</h1><p class="muted">Sign in to the SOC Command Center. Authenticate to continue to your evidence-backed investigations.</p><p id="signed-out" class="muted" hidden>You have been signed out.</p><a class="oauth" href="/api/auth/google/start">Continue with Google</a><p class="muted">or sign in with password</p><form id="login-form"><label for="username">Email or username</label><input id="username" autocomplete="username" required><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button type="button" data-toggle aria-label="Show password">Show</button></div><label class="check"><input id="remember" type="checkbox"> Remember this device</label><button type="submit">Sign in</button><p id="status" class="status" role="alert"></p></form><p class="muted">Need a code? <button id="email-otp" type="button">Sign in with email code</button></p><p class="muted">Don't have an account? <a href="/signup">Create an analyst account</a></p></main><script>if(new URLSearchParams(location.search).get('signed_out')==='true')document.getElementById('signed-out').hidden=false;const csrf=async()=>{const r=await fetch('/api/auth/csrf');return(await r.json()).csrf_token};document.querySelector('[data-toggle]').onclick=()=>{const i=password,b=document.querySelector('[data-toggle]');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide'};document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':await csrf()},body:JSON.stringify({username:username.value,password:password.value,remember_me:remember.checked})});if(r.ok)location='/';else status.textContent='Sign-in failed. Check your credentials and try again.'}</script></body></html>
