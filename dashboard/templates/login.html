<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Secure enterprise access | Sentinel DNA</title>
  <link rel="stylesheet" href="{{ url_for('dashboard_static', filename='css/sentinel-dna-auth.css') }}">
</head>
<body class="auth-body">
  <div class="auth-frame">
    <main class="auth-panel" aria-labelledby="login-title">
      <div class="auth-panel-head">
        <div class="auth-panel-brand"><span class="auth-mark" aria-hidden="true">SD</span><span>Sentinel DNA</span></div>
        <span class="auth-state">Protected workspace</span>
      </div>
      <p class="auth-eyebrow">Secure enterprise access</p>
      <h2 id="login-title">Sign in to the SOC Command Center</h2>
      <p class="auth-status is-success" data-signed-out hidden role="status">You have been signed out.</p>
      <p class="auth-status is-success" data-registered hidden role="status">Workspace request received. Sign in to continue.</p>
      <form class="auth-form" data-auth-form="login" novalidate>
        <div class="auth-field"><label for="login-username">Work email</label><input id="login-username" type="email" autocomplete="username" placeholder="name@company.com" required></div>
        <div class="auth-field"><div class="auth-label-row"><label for="login-password">Password</label><a href="/forgot-password">Recover access</a></div><div class="auth-password"><input id="login-password" type="password" autocomplete="current-password" required><button type="button" data-password-toggle="login-password" aria-label="Show password">Show</button></div></div>
        <div class="auth-row"><label class="auth-check"><input id="login-remember" type="checkbox"> Remember this device</label></div>
        <button class="auth-button" type="submit">Continue</button>
        <p class="auth-status" data-auth-status role="alert" aria-live="polite"></p>
      </form>
      <section class="auth-enterprise">
        <div class="auth-divider"><span>Enterprise identity</span></div>
        <div class="auth-idp-list" data-idp-selector data-idp-context="login" aria-label="Configured enterprise identity providers"></div>
      </section>
      <p class="auth-footer">Need a secure workspace? <a href="/signup">Create your workspace</a></p>
    </main>
  </div>
  <script type="module" src="{{ url_for('dashboard_static', filename='js/sentinel-dna-auth.js') }}"></script>
</body>
</html>
