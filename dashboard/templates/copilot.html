<!doctype html><html><head><title>Sentinel DNA AI Copilot</title></head><body><main><h1>AI SOC Analyst Workspace</h1><p>Ask an investigation question, inspect evidence reasoning, replay the timeline, and provide analyst feedback.</p><textarea id="question" placeholder="Ask about this investigation..."></textarea><button onclick="ask()">Ask Copilot</button><pre id="answer"></pre><section><h2>Conversation</h2><div id="history"></div></section><section><h2>Feedback</h2><button onclick="feedback('approved')">Approve</button><button onclick="feedback('rejected')">Reject</button></section><script>function ask(){fetch('/api/intelligence/chat/ask',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':window.csrfToken||''},body:JSON.stringify({question:document.getElementById('question').value})}).then(r=>r.json()).then(x=>document.getElementById('answer').textContent=JSON.stringify(x,null,2))}function feedback(outcome){fetch('/api/intelligence/chat/feedback',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':window.csrfToken||''},body:JSON.stringify({outcome:outcome,decision_id:'workspace'})})}</script></main></body></html>
