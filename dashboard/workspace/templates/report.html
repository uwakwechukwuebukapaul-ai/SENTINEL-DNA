<!doctype html><html><head><meta charset="utf-8"><title>Investigation Report</title><link rel="stylesheet" href="{{ url_for('static', filename='workspace.css') }}"></head><body><main class="shell"><h1>{{ report.title }}</h1><p>{{ report.summary }}</p><p>Risk: {{ report.risk.score }} ({{ report.risk.severity }})</p><h2>Recommendations</h2><ul>{% for item in report.recommendations %}<li>{{ item }}</li>{% endfor %}</ul><h2>MITRE</h2><p>{{ report.mitre|join(', ') }}</p></main></body></html>
