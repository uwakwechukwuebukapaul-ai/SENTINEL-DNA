<!doctype html><html><head><meta charset="utf-8"><title>Cases</title><link rel="stylesheet" href="{{ url_for('static', filename='workspace.css') }}"></head><body><main class="shell"><h1>Cases</h1><table><tr><th>Case ID</th><th>Title</th><th>Severity</th><th>Status</th><th>Analyst</th></tr>{% for case in cases %}<tr><td><a href="/workspace/investigation/{{ case.case_id }}">{{ case.case_id }}</a></td><td>{{ case.title }}</td><td>{{ case.severity }}</td><td>{{ case.status }}</td><td>{{ case.analyst }}</td></tr>{% endfor %}</table></main></body></html>
