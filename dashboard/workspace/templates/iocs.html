<!doctype html><html><head><meta charset="utf-8"><title>IOC Explorer</title><link rel="stylesheet" href="{{ url_for('static', filename='workspace.css') }}"></head><body><main class="shell"><h1>IOC Explorer</h1><table><tr><th>IOC</th><th>Type</th><th>Case</th><th>Created</th></tr>{% for ioc in iocs %}<tr><td>{{ ioc.value }}</td><td>{{ ioc.type }}</td><td><a href="/workspace/investigation/{{ ioc.case_id }}">{{ ioc.case_id }}</a></td><td>{{ ioc.created }}</td></tr>{% endfor %}</table></main></body></html>
