apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: sentinel-dna}
spec:
  podSelector: {matchLabels: {app: sentinel-dna}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {sentinel-dna-access: "true"}}}]
      ports: [{protocol: TCP, port: 5000}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {sentinel-dna-dependency: "true"}}}]
      ports: [{protocol: TCP}]
