services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SENTINEL_DNA_REHEARSAL_DB:-sentinel_dna_rehearsal}
      POSTGRES_USER: ${SENTINEL_DNA_REHEARSAL_USER:-sentinel_rehearsal}
      POSTGRES_PASSWORD_FILE: /run/secrets/sentinel_dna_rehearsal_password
    secrets:
      - sentinel_dna_rehearsal_password
    ports:
      - "127.0.0.1:${SENTINEL_DNA_REHEARSAL_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

secrets:
  sentinel_dna_rehearsal_password:
    file: ${SENTINEL_DNA_REHEARSAL_PASSWORD_FILE:?set external rehearsal password file}
