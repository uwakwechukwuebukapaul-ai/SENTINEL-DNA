[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-dna-custody"
version = "0.1.0"
description = "Standalone Sentinel DNA staging artifact custody authority"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0"]

[project.scripts]
sdna-custody = "sdna_custody.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
