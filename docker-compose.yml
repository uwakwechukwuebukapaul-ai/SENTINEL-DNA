services:
  migration:
    build: .
    command: ["python", "-m", "database.run_migrations"]
    restart: "no"
    environment:
      SENTINEL_DNA_ENV: production
      SENTINEL_DNA_SECRET_KEY: ${SENTINEL_DNA_SECRET_KEY:?SENTINEL_DNA_SECRET_KEY must be set}
      SENTINEL_DNA_SECURE_COOKIES: "1"
      DATABASE_URL: ${DATABASE_URL:-postgresql://sentinel@postgres:5432/sentinel_dna}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SENTINEL_DNA_DB_PATH: ${SENTINEL_DNA_DB_PATH:-/var/lib/sentinel/soc.db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sentinel_backend

  sentinel-dna:
    build: .
    restart: unless-stopped
    environment:
      SENTINEL_DNA_ENV: production
      SENTINEL_DNA_SECRET_KEY: ${SENTINEL_DNA_SECRET_KEY:?SENTINEL_DNA_SECRET_KEY must be set}
      SENTINEL_DNA_SECURE_COOKIES: "1"
      FLASK_DEBUG: "0"
      DATABASE_URL: ${DATABASE_URL:-postgresql://sentinel@postgres:5432/sentinel_dna}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_URL: redis://redis:6379/0
      SENTINEL_DNA_DB_PATH: ${SENTINEL_DNA_DB_PATH:-/var/lib/sentinel/soc.db}
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - sentinel_data:/var/lib/sentinel
    networks:
      sentinel_frontend:
        aliases:
          - app
      sentinel_backend:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel_dna
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - sentinel_postgres:/var/lib/postgresql/data
    networks:
      - sentinel_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_dna"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sentinel_redis:/data
    networks:
      - sentinel_backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      sentinel-dna:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${SENTINEL_DNA_TLS_DIR:?SENTINEL_DNA_TLS_DIR must be set}
        target: /etc/nginx/tls
        read_only: true
    networks:
      - sentinel_frontend

volumes:
  sentinel_data:
  sentinel_postgres:
  sentinel_redis:

networks:
  sentinel_frontend:
  sentinel_backend:
    internal: true
