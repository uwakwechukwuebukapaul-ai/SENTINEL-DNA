services:

  migration:
    image: sentinel-dna-staging-ui-fix:local
    restart: "no"

    command:
      - python
      - -m
      - database.run_migrations

    environment:
      SENTINEL_DNA_ENV: ${SENTINEL_DNA_ENV:?SENTINEL_DNA_ENV must be set}
      SENTINEL_DNA_SECRET_KEY_FILE: /run/secrets/sentinel_dna_secret_key
      SENTINEL_DNA_EMAIL_PROVIDER: ${SENTINEL_DNA_EMAIL_PROVIDER:?SENTINEL_DNA_EMAIL_PROVIDER must be set}
      SENTINEL_DNA_SMTP_HOST: ${SENTINEL_DNA_SMTP_HOST:?SENTINEL_DNA_SMTP_HOST must be set}
      SENTINEL_DNA_SMTP_PORT: ${SENTINEL_DNA_SMTP_PORT:-587}
      SENTINEL_DNA_SMTP_USERNAME_FILE: /run/secrets/sentinel_dna_smtp_username
      SENTINEL_DNA_SMTP_PASSWORD_FILE: /run/secrets/sentinel_dna_smtp_password
      SENTINEL_DNA_SMTP_STARTTLS: ${SENTINEL_DNA_SMTP_STARTTLS:-1}
      SENTINEL_DNA_EMAIL_FROM: ${SENTINEL_DNA_EMAIL_FROM:?SENTINEL_DNA_EMAIL_FROM must be set}

      SENTINEL_DNA_SECURE_COOKIES: "1"
      SENTINEL_DNA_CONFIG_SOURCE_CLASSIFICATION: external_non_production
      SENTINEL_DNA_DATABASE_TARGET_CLASSIFICATION: disposable_staging

      SENTINEL_DNA_PILOT_ACCESS_REQUIRED: ${SENTINEL_DNA_PILOT_ACCESS_REQUIRED:?SENTINEL_DNA_PILOT_ACCESS_REQUIRED must be set}
      SENTINEL_DNA_TENANT_ISOLATION_ENABLED: ${SENTINEL_DNA_TENANT_ISOLATION_ENABLED:?SENTINEL_DNA_TENANT_ISOLATION_ENABLED must be set}
      SENTINEL_DNA_AUDIT_LOGGING_ENABLED: ${SENTINEL_DNA_AUDIT_LOGGING_ENABLED:?SENTINEL_DNA_AUDIT_LOGGING_ENABLED must be set}

      FLASK_DEBUG: "0"

      DATABASE_URL: ${DATABASE_URL:-postgresql://sentinel@postgres:5432/sentinel_dna}
      SENTINEL_DNA_POSTGRES_PASSWORD_FILE: /run/secrets/sentinel_dna_postgres_password
      SENTINEL_DNA_DB_PATH: ${SENTINEL_DNA_DB_PATH:-/var/lib/sentinel/soc.db}
    secrets:
      - sentinel_dna_secret_key
      - sentinel_dna_smtp_username
      - sentinel_dna_smtp_password
      - sentinel_dna_postgres_password

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - sentinel_backend

  sentinel-dna:
    image: sentinel-dna-staging-ui-fix:local
    # This local staging validation image is built from the reviewed repository
    # Dockerfile.  Provenance values are mandatory so a stale or unlabelled
    # image cannot be built accidentally.  The controlled deployment compose
    # remains the immutable, externally-custodied staging artifact flow.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${SENTINEL_DNA_IMAGE_REVISION_FULL:?SENTINEL_DNA_IMAGE_REVISION_FULL must be set}
        VCS_REF_FULL: ${SENTINEL_DNA_IMAGE_REVISION_FULL:?SENTINEL_DNA_IMAGE_REVISION_FULL must be set}
        IMAGE_VERSION: ${SENTINEL_DNA_IMAGE_REVISION_FULL:?SENTINEL_DNA_IMAGE_REVISION_FULL must be set}
        IMAGE_SOURCE: https://github.com/uwakwechukwuebukpaul-ai/SENTINEL-DNA
        IMAGE_CREATED: ${SENTINEL_DNA_IMAGE_CREATED:?SENTINEL_DNA_IMAGE_CREATED must be set}
    restart: unless-stopped

    environment:
      SENTINEL_DNA_ENV: ${SENTINEL_DNA_ENV:?SENTINEL_DNA_ENV must be set}
      SENTINEL_DNA_SECRET_KEY_FILE: /run/secrets/sentinel_dna_secret_key
      SENTINEL_DNA_EMAIL_PROVIDER: ${SENTINEL_DNA_EMAIL_PROVIDER:?SENTINEL_DNA_EMAIL_PROVIDER must be set}
      SENTINEL_DNA_SMTP_HOST: ${SENTINEL_DNA_SMTP_HOST:?SENTINEL_DNA_SMTP_HOST must be set}
      SENTINEL_DNA_SMTP_PORT: ${SENTINEL_DNA_SMTP_PORT:-587}
      SENTINEL_DNA_SMTP_USERNAME_FILE: /run/secrets/sentinel_dna_smtp_username
      SENTINEL_DNA_SMTP_PASSWORD_FILE: /run/secrets/sentinel_dna_smtp_password
      SENTINEL_DNA_SMTP_STARTTLS: ${SENTINEL_DNA_SMTP_STARTTLS:-1}
      SENTINEL_DNA_EMAIL_FROM: ${SENTINEL_DNA_EMAIL_FROM:?SENTINEL_DNA_EMAIL_FROM must be set}

      # Microsoft Entra OIDC - local staging
      SENTINEL_DNA_ENTRA_OIDC_ENABLED: ${SENTINEL_DNA_ENTRA_OIDC_ENABLED:-0}
      SENTINEL_DNA_ENTRA_TENANT_ID: ${SENTINEL_DNA_ENTRA_TENANT_ID:-}
      SENTINEL_DNA_ENTRA_CLIENT_ID: ${SENTINEL_DNA_ENTRA_CLIENT_ID:-}
      SENTINEL_DNA_ENTRA_CLIENT_SECRET_REFERENCE: SENTINEL_DNA_ENTRA_CLIENT_SECRET
      SENTINEL_DNA_ENTRA_CLIENT_SECRET_FILE: /run/secrets/entra_client_secret
      SENTINEL_DNA_ENTRA_REDIRECT_URI: ${SENTINEL_DNA_ENTRA_REDIRECT_URI:-https://localhost/auth/enterprise/entra/callback}
      SENTINEL_DNA_CERTIFIED_ORIGIN: ${SENTINEL_DNA_CERTIFIED_ORIGIN:-https://localhost}
      SENTINEL_DNA_ENTRA_ISSUER: ${SENTINEL_DNA_ENTRA_ISSUER:-}
      SENTINEL_DNA_ENTRA_AUTHORIZATION_ENDPOINT: ${SENTINEL_DNA_ENTRA_AUTHORIZATION_ENDPOINT:-}
      SENTINEL_DNA_ENTRA_TOKEN_ENDPOINT: ${SENTINEL_DNA_ENTRA_TOKEN_ENDPOINT:-}
      SENTINEL_DNA_ENTRA_JWKS_URI: ${SENTINEL_DNA_ENTRA_JWKS_URI:-}
      SENTINEL_DNA_ENTRA_DISCOVERY_URI: ${SENTINEL_DNA_ENTRA_DISCOVERY_URI:-}

      SENTINEL_DNA_SECURE_COOKIES: "1"
      SENTINEL_DNA_CONFIG_SOURCE_CLASSIFICATION: external_non_production
      SENTINEL_DNA_DATABASE_TARGET_CLASSIFICATION: disposable_staging
      SENTINEL_DNA_PILOT_ACCESS_REQUIRED: ${SENTINEL_DNA_PILOT_ACCESS_REQUIRED:?SENTINEL_DNA_PILOT_ACCESS_REQUIRED must be set}
      SENTINEL_DNA_TENANT_ISOLATION_ENABLED: ${SENTINEL_DNA_TENANT_ISOLATION_ENABLED:?SENTINEL_DNA_TENANT_ISOLATION_ENABLED must be set}
      SENTINEL_DNA_AUDIT_LOGGING_ENABLED: ${SENTINEL_DNA_AUDIT_LOGGING_ENABLED:?SENTINEL_DNA_AUDIT_LOGGING_ENABLED must be set}
      FLASK_DEBUG: "0"


      DATABASE_URL: ${DATABASE_URL:-postgresql://sentinel@postgres:5432/sentinel_dna}
      SENTINEL_DNA_POSTGRES_PASSWORD_FILE: /run/secrets/sentinel_dna_postgres_password

      REDIS_URL: redis://redis:6379/0

      SENTINEL_DNA_DB_PATH: ${SENTINEL_DNA_DB_PATH:-/var/lib/sentinel/soc.db}

    expose:
      - "5000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migration:
        condition: service_completed_successfully

    volumes:
      - sentinel_data:/var/lib/sentinel
    secrets:
      - sentinel_dna_secret_key
      - sentinel_dna_smtp_username
      - sentinel_dna_smtp_password
      - entra_client_secret
      - sentinel_dna_postgres_password

    networks:
      sentinel_frontend:
        aliases:
          - app

      sentinel_backend:

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready')

      interval: 30s
      timeout: 5s
      retries: 3



  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: sentinel_dna
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD_FILE: /run/secrets/sentinel_dna_postgres_password
    secrets:
      - sentinel_dna_postgres_password

    volumes:
      - sentinel_postgres:/var/lib/postgresql/data

    networks:
      - sentinel_backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U sentinel -d sentinel_dna
      interval: 10s
      timeout: 5s
      retries: 5



  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - sentinel_redis:/data

    networks:
      - sentinel_backend

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5



  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    depends_on:
      sentinel-dna:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro

      - type: bind
        source: ${SENTINEL_DNA_TLS_DIR:-./certs}
        target: /etc/nginx/tls
        read_only: true

    networks:
      - sentinel_frontend



volumes:

  sentinel_data:

  sentinel_postgres:

  sentinel_redis:



networks:

  sentinel_frontend:

  sentinel_backend:
    internal: true

secrets:
  sentinel_dna_secret_key:
    file: ${SENTINEL_DNA_SECRET_KEY_FILE:?SENTINEL_DNA_SECRET_KEY_FILE must be set}
  sentinel_dna_postgres_password:
    file: ${SENTINEL_DNA_POSTGRES_PASSWORD_FILE:?SENTINEL_DNA_POSTGRES_PASSWORD_FILE must be set}
  sentinel_dna_smtp_username:
    file: ${SENTINEL_DNA_SMTP_USERNAME_FILE:?SENTINEL_DNA_SMTP_USERNAME_FILE must be set}
  sentinel_dna_smtp_password:
    file: ${SENTINEL_DNA_SMTP_PASSWORD_FILE:?SENTINEL_DNA_SMTP_PASSWORD_FILE must be set}
  entra_client_secret:
    file: ${SENTINEL_DNA_ENTRA_CLIENT_SECRET_FILE:?SENTINEL_DNA_ENTRA_CLIENT_SECRET_FILE must be set}
