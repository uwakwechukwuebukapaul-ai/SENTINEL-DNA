name: security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r requirements.txt
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Download and verify Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CHECKSUMS_SHA256: "061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail

          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive="$RUNNER_TEMP/$archive_name"
          checksums="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          install_dir="$RUNNER_TEMP/gitleaks"

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output "$checksums" \
            "$base_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          printf '%s  %s\n' "$GITLEAKS_CHECKSUMS_SHA256" "$checksums" \
            | sha256sum --check --status -

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "$base_url/$archive_name"

          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --status -

          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar --extract --file "$archive" --directory "$install_dir"
          test -x "$install_dir/gitleaks"
          "$install_dir/gitleaks" version | grep -F -- "$GITLEAKS_VERSION"

      - name: Scan repository history for secrets
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks/gitleaks" git \
            --redact=100 \
            --no-banner \
            .
