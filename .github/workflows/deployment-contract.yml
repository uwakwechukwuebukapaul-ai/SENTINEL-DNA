name: deployment-contract

on:
  workflow_dispatch:
    inputs:
      authorized_ref:
        description: Protected release branch/ref selected by the release owner
        required: true
        type: string
      authorized_sha:
        description: Full 40-character SHA approved for this validation
        required: true
        type: string
      authorized_tree:
        description: Git tree object approved for this validation
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deployment-contract-${{ vars.SENTINEL_DNA_AUTHORIZED_RELEASE_SHA }}
  cancel-in-progress: false

jobs:
  validate-release-contract:
    name: Validate protected production release contract
    runs-on: ubuntu-latest
    environment: production
    env:
      SENTINEL_DNA_ENV: production
      SENTINEL_DNA_SECURE_COOKIES: "1"
      SENTINEL_DNA_DB_PATH: /var/lib/sentinel/soc.db
      SENTINEL_DNA_TLS_DIR: ${{ vars.SENTINEL_DNA_TLS_DIR }}
      SENTINEL_DNA_AUTHORIZED_WORKFLOW_REF: ${{ vars.SENTINEL_DNA_AUTHORIZED_WORKFLOW_REF }}
      SENTINEL_DNA_AUTHORIZED_WORKFLOW_SHA: ${{ vars.SENTINEL_DNA_AUTHORIZED_WORKFLOW_SHA }}
      SENTINEL_DNA_AUTHORIZED_RELEASE_REF: ${{ vars.SENTINEL_DNA_AUTHORIZED_RELEASE_REF }}
      SENTINEL_DNA_AUTHORIZED_RELEASE_SHA: ${{ vars.SENTINEL_DNA_AUTHORIZED_RELEASE_SHA }}
      SENTINEL_DNA_AUTHORIZED_RELEASE_TREE: ${{ vars.SENTINEL_DNA_AUTHORIZED_RELEASE_TREE }}
      SENTINEL_DNA_AUTHORIZED_BASELINE_SHA: ${{ vars.SENTINEL_DNA_AUTHORIZED_BASELINE_SHA }}
    steps:
      - name: Verify protected workflow identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error title=Protected workflow identity::$1" >&2
            exit 1
          }

          test -n "${SENTINEL_DNA_AUTHORIZED_WORKFLOW_REF:-}" \
            || fail "authorized workflow ref is missing"
          test -n "${SENTINEL_DNA_AUTHORIZED_WORKFLOW_SHA:-}" \
            || fail "authorized workflow commit is missing"
          [[ "$SENTINEL_DNA_AUTHORIZED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail "authorized workflow commit is malformed"
          test -n "${GITHUB_WORKFLOW_REF:-}" \
            || fail "GitHub workflow ref identity is missing"
          test -n "${GITHUB_WORKFLOW_SHA:-}" \
            || fail "GitHub workflow commit identity is missing"
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail "GitHub workflow commit identity is malformed"
          test "$GITHUB_REF" = "refs/heads/$SENTINEL_DNA_AUTHORIZED_WORKFLOW_REF" \
            || fail "workflow dispatch ref mismatch: expected refs/heads/$SENTINEL_DNA_AUTHORIZED_WORKFLOW_REF, observed $GITHUB_REF"
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/deployment-contract.yml@refs/heads/$SENTINEL_DNA_AUTHORIZED_WORKFLOW_REF"
          test "$GITHUB_WORKFLOW_REF" = "$expected_workflow_ref" \
            || fail "workflow definition ref mismatch: expected $expected_workflow_ref, observed $GITHUB_WORKFLOW_REF"

          workflow_api_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/.github/workflows/deployment-contract.yml"
          workflow_blob_sha() {
            local ref="$1"
            curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$workflow_api_url?ref=$ref" \
              | jq --exit-status --raw-output '.sha'
          }
          authorized_workflow_blob="$(workflow_blob_sha "$SENTINEL_DNA_AUTHORIZED_WORKFLOW_SHA")" \
            || fail "could not resolve the authorized workflow file at $SENTINEL_DNA_AUTHORIZED_WORKFLOW_SHA"
          executed_workflow_blob="$(workflow_blob_sha "$GITHUB_WORKFLOW_SHA")" \
            || fail "could not resolve the executed workflow file at $GITHUB_WORKFLOW_SHA"
          [[ "$authorized_workflow_blob" =~ ^[0-9a-f]{40}$ ]] \
            || fail "authorized workflow file identity is malformed"
          [[ "$executed_workflow_blob" =~ ^[0-9a-f]{40}$ ]] \
            || fail "executed workflow file identity is malformed"
          test "$executed_workflow_blob" = "$authorized_workflow_blob" \
            || fail "workflow file identity mismatch: authorized blob $authorized_workflow_blob, executed blob $executed_workflow_blob"

      - name: Validate protected release identity before checkout
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SENTINEL_DNA_AUTHORIZED_WORKFLOW_REF"
          test -n "$SENTINEL_DNA_AUTHORIZED_RELEASE_REF"
          test -n "$SENTINEL_DNA_AUTHORIZED_WORKFLOW_SHA"
          test -n "$SENTINEL_DNA_AUTHORIZED_RELEASE_SHA"
          test -n "$SENTINEL_DNA_AUTHORIZED_RELEASE_TREE"
          test -n "$SENTINEL_DNA_AUTHORIZED_BASELINE_SHA"
          [[ "$SENTINEL_DNA_AUTHORIZED_WORKFLOW_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
          [[ "$SENTINEL_DNA_AUTHORIZED_RELEASE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
          git check-ref-format --branch "$SENTINEL_DNA_AUTHORIZED_WORKFLOW_REF" >/dev/null
          git check-ref-format --branch "$SENTINEL_DNA_AUTHORIZED_RELEASE_REF" >/dev/null
          [[ "$SENTINEL_DNA_AUTHORIZED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SENTINEL_DNA_AUTHORIZED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SENTINEL_DNA_AUTHORIZED_RELEASE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SENTINEL_DNA_AUTHORIZED_BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout protected candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.SENTINEL_DNA_AUTHORIZED_RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify protected candidate identity
        shell: bash
        env:
          REQUESTED_RELEASE_REF: ${{ inputs.authorized_ref }}
          REQUESTED_RELEASE_SHA: ${{ inputs.authorized_sha }}
          REQUESTED_RELEASE_TREE: ${{ inputs.authorized_tree }}
        run: |
          set -euo pipefail
          test -n "$SENTINEL_DNA_AUTHORIZED_RELEASE_REF"
          test -n "$SENTINEL_DNA_AUTHORIZED_RELEASE_SHA"
          test -n "$SENTINEL_DNA_AUTHORIZED_RELEASE_TREE"
          test -n "$SENTINEL_DNA_AUTHORIZED_BASELINE_SHA"
          [[ "$REQUESTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_RELEASE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_RELEASE_REF" = "$SENTINEL_DNA_AUTHORIZED_RELEASE_REF"
          test "$REQUESTED_RELEASE_SHA" = "$SENTINEL_DNA_AUTHORIZED_RELEASE_SHA"
          test "$REQUESTED_RELEASE_TREE" = "$SENTINEL_DNA_AUTHORIZED_RELEASE_TREE"
          test "$(git rev-parse HEAD)" = "$SENTINEL_DNA_AUTHORIZED_RELEASE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SENTINEL_DNA_AUTHORIZED_RELEASE_TREE"
          git cat-file -e "${SENTINEL_DNA_AUTHORIZED_BASELINE_SHA}^{commit}"
          git merge-base --is-ancestor \
            "$SENTINEL_DNA_AUTHORIZED_BASELINE_SHA" \
            "$SENTINEL_DNA_AUTHORIZED_RELEASE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify tracked deployment release boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f deployment/scripts/controlled_deploy.py
          test -f deployment/scripts/validate_deployment_config.py
          test -f deployment/scripts/release_metadata.py
          test -f deployment/scripts/prepare_trusted_release_metadata.py
          test -f deployment/scripts/release_manifest.py
          test -f deployment/scripts/build_context_policy.py
          test -f deployment/docker-compose.yml
          test -f deployment/nginx.conf
          test -f Dockerfile
          test -f tests/deployment/test_controlled_deploy.py
          test -f tests/deployment/test_release_contract.py
          test -f tests/deployment/test_release_manifest.py
          test -f tests/deployment/test_build_context_policy.py
          test -f tests/deployment/test_trusted_release_metadata.py

      - name: Derive immutable release metadata
        shell: bash
        run: python deployment/scripts/release_metadata.py --format github-env >> "$GITHUB_ENV"

      - name: Generate and verify deterministic release manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/sentinel-dna-release-manifest.json"
          python deployment/scripts/release_manifest.py build \
            --output "$manifest" \
            --image-reference "deployment-app:${SENTINEL_DNA_IMAGE_TAG}" \
            --image-revision "$SENTINEL_DNA_IMAGE_REVISION_FULL" \
            --image-source "https://github.com/uwakwechukwuebukapaul-ai/SENTINEL-DNA"
          python deployment/scripts/release_manifest.py verify \
            --manifest "$manifest" \
            --expected-release-sha "$SENTINEL_DNA_AUTHORIZED_RELEASE_SHA"

      - name: Verify Docker build-context policy
        shell: bash
        run: python deployment/scripts/build_context_policy.py --repository-root .

      - name: Build immutable application image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --tag "deployment-app:${SENTINEL_DNA_IMAGE_TAG}" \
            --build-arg "VCS_REF=${SENTINEL_DNA_IMAGE_REVISION_FULL}" \
            --build-arg "VCS_REF_FULL=${SENTINEL_DNA_IMAGE_REVISION_FULL}" \
            --build-arg "IMAGE_VERSION=${SENTINEL_DNA_IMAGE_TAG}" \
            --build-arg "IMAGE_SOURCE=https://github.com/uwakwechukwuebukapaul-ai/SENTINEL-DNA" \
            --build-arg "IMAGE_CREATED=${SENTINEL_DNA_IMAGE_CREATED}" \
            .

      - name: Verify image provenance and non-root configuration
        shell: bash
        run: |
          set -euo pipefail
          image="deployment-app:${SENTINEL_DNA_IMAGE_TAG}"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "sentinel"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SENTINEL_DNA_IMAGE_REVISION_FULL"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "com.sentinel-dna.git.revision.full"}}')" = "$SENTINEL_DNA_IMAGE_REVISION_FULL"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$SENTINEL_DNA_IMAGE_TAG"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/uwakwechukwuebukapaul-ai/SENTINEL-DNA"

      - name: Verify OCI creation metadata
        shell: bash
        run: |
          set -euo pipefail
          image="deployment-app:${SENTINEL_DNA_IMAGE_TAG}"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.created"}}')" = "$SENTINEL_DNA_IMAGE_CREATED"

      - name: Run deployment-adjacent regression tests
        run: |
          python -m pytest -q \
            tests/deployment/test_controlled_deploy.py \
            tests/deployment/test_release_contract.py \
            tests/deployment/test_release_manifest.py \
            tests/deployment/test_build_context_policy.py \
            tests/deployment/test_trusted_release_metadata.py \
            tests/production/test_runtime_hardening.py \
            tests/intelligence/api/test_execution_visibility_api.py \
            tests/security/test_production_entrypoint_reconciliation.py \
            tests/intelligence/runtime/test_execution_durable_state.py \
            tests/staging/test_staging_security_contract.py

      - name: Authenticate to private GHCR
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ github.token }}" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Refuse an existing candidate tag
        shell: bash
        env:
          GHCR_IMAGE: ghcr.io/uwakwechukwuebukapaul-ai/sentinel-dna
        run: |
          set -euo pipefail
          ghcr_ref="${GHCR_IMAGE}:sha-${SENTINEL_DNA_IMAGE_REVISION_FULL}"
          if probe_output="$(docker manifest inspect "$ghcr_ref" 2>&1)"; then
            echo "candidate GHCR tag already exists; refusing to overwrite"
            exit 1
          fi
          case "$probe_output" in
            *"manifest unknown"*|*"no such manifest"*|*"not found"*) ;;
            *) echo "unable to prove candidate GHCR tag is absent" >&2; exit 1 ;;
          esac

      - name: Publish immutable candidate image to private GHCR
        shell: bash
        env:
          GHCR_IMAGE: ghcr.io/uwakwechukwuebukapaul-ai/sentinel-dna
        run: |
          set -euo pipefail
          ghcr_tag="sha-${SENTINEL_DNA_IMAGE_REVISION_FULL}"
          ghcr_ref="${GHCR_IMAGE}:${ghcr_tag}"
          docker tag "deployment-app:${SENTINEL_DNA_IMAGE_TAG}" "$ghcr_ref"
          docker push "$ghcr_ref"

          repo_digests_json="$(docker image inspect "$ghcr_ref" --format '{{json .RepoDigests}}')"
          image_id="$(docker image inspect "$ghcr_ref" --format '{{.Id}}')"
          oci_revision="$(docker image inspect "$ghcr_ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          oci_source="$(docker image inspect "$ghcr_ref" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')"
          oci_created="$(docker image inspect "$ghcr_ref" --format '{{index .Config.Labels "org.opencontainers.image.created"}}')"
          runtime_user="$(docker image inspect "$ghcr_ref" --format '{{.Config.User}}')"
          command_json="$(docker image inspect "$ghcr_ref" --format '{{json .Config.Cmd}}')"
          entrypoint_json="$(docker image inspect "$ghcr_ref" --format '{{json .Config.Entrypoint}}')"
          exposed_ports_json="$(docker image inspect "$ghcr_ref" --format '{{json .Config.ExposedPorts}}')"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          publication_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          export GHCR_REF="$ghcr_ref" GHCR_TAG="$ghcr_tag" IMAGE_ID="$image_id"
          export REPO_DIGESTS_JSON="$repo_digests_json"
          export OCI_REVISION="$oci_revision" OCI_SOURCE="$oci_source" OCI_CREATED="$oci_created"
          export RUNTIME_USER="$runtime_user" COMMAND_JSON="$command_json" ENTRYPOINT_JSON="$entrypoint_json"
          export EXPOSED_PORTS_JSON="$exposed_ports_json" CANDIDATE_SHA="$SENTINEL_DNA_AUTHORIZED_RELEASE_SHA"
          export CANDIDATE_TREE="$candidate_tree" PUBLICATION_TIMESTAMP="$publication_timestamp"
          export EVIDENCE_PATH="$RUNNER_TEMP/sentinel-dna-image-provenance.json"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          ghcr_image = "ghcr.io/uwakwechukwuebukapaul-ai/sentinel-dna"
          repo_digests = json.loads(os.environ["REPO_DIGESTS_JSON"])
          matching = [
              value.rsplit("@", 1)[1]
              for value in repo_digests
              if isinstance(value, str) and value.startswith(ghcr_image + "@")
          ]
          if len(matching) != 1 or not re.fullmatch(r"sha256:[0-9a-f]{64}", matching[0]):
              raise SystemExit("published image must have exactly one matching GHCR RepoDigest")
          immutable_digest = matching[0]

          command = json.loads(os.environ["COMMAND_JSON"])
          entrypoint = json.loads(os.environ["ENTRYPOINT_JSON"])
          exposed_ports = json.loads(os.environ["EXPOSED_PORTS_JSON"])
          if "gunicorn" not in command or "wsgi:application" not in command:
              raise SystemExit("published image command contract failed")
          if set(exposed_ports) != {"5000/tcp"}:
              raise SystemExit("published image exposed-port contract failed")
          if not os.environ["IMAGE_ID"]:
              raise SystemExit("published image ID is missing")
          if os.environ["OCI_REVISION"] != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("published image revision does not match candidate SHA")
          if os.environ["OCI_SOURCE"] != "https://github.com/uwakwechukwuebukapaul-ai/SENTINEL-DNA":
              raise SystemExit("published image source is invalid")
          if os.environ["RUNTIME_USER"] != "sentinel":
              raise SystemExit("published image runtime user is invalid")

          evidence = {
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "candidate_tree": os.environ["CANDIDATE_TREE"],
              "registry": "ghcr.io",
              "repository": ghcr_image,
              "image_reference": os.environ["GHCR_REF"],
              "tag": os.environ["GHCR_TAG"],
              "image_id": os.environ["IMAGE_ID"],
              "repo_digest": ghcr_image + "@" + immutable_digest,
              "immutable_digest": immutable_digest,
              "oci_revision": os.environ["OCI_REVISION"],
              "oci_source": os.environ["OCI_SOURCE"],
              "oci_created": os.environ["OCI_CREATED"],
              "runtime_user": os.environ["RUNTIME_USER"],
              "entrypoint": entrypoint,
              "command": command,
              "exposed_ports": exposed_ports,
              "publication_timestamp": os.environ["PUBLICATION_TIMESTAMP"],
              "verification_status": "PASS",
              "custodian": "GitHub Actions workflow",
              "authorization_status": "workflow-token-scoped",
          }
          Path(os.environ["EVIDENCE_PATH"]).write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"PUBLISHED_IMAGE_REFERENCE={os.environ['GHCR_REF']}\n")
              env_file.write(f"PUBLISHED_IMAGE_DIGEST={immutable_digest}\n")
              env_file.write(f"PUBLISHED_IMAGE_ID={os.environ['IMAGE_ID']}\n")
              env_file.write(f"PUBLISHED_REPO_DIGEST={ghcr_image}@{immutable_digest}\n")
              env_file.write(f"IMAGE_PROVENANCE_PATH={os.environ['EVIDENCE_PATH']}\n")
          PY

      - name: Prepare candidate-bound trusted release metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata_path="$RUNNER_TEMP/sentinel-dna-trusted-release-metadata.json"
          python deployment/scripts/prepare_trusted_release_metadata.py \
            --image "$PUBLISHED_IMAGE_REFERENCE" \
            --expected-revision "$SENTINEL_DNA_AUTHORIZED_RELEASE_SHA" \
            --expected-digest "$PUBLISHED_IMAGE_DIGEST" \
            --output "$metadata_path"
          echo "SENTINEL_DNA_IMAGE_DIGEST=$PUBLISHED_IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "SENTINEL_DNA_GATE1_TRUSTED_METADATA_FILE=$metadata_path" >> "$GITHUB_ENV"

      - name: Validate protected configuration and metadata
        shell: bash
        env:
          SENTINEL_DNA_SECRET_KEY: ${{ secrets.SENTINEL_DNA_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: python deployment/scripts/validate_deployment_config.py

      - name: Validate deployment Compose contract
        shell: bash
        env:
          SENTINEL_DNA_SECRET_KEY: ${{ secrets.SENTINEL_DNA_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: docker compose -f deployment/docker-compose.yml config --quiet

      - name: Generate image-bound release manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/sentinel-dna-release-manifest-image-bound.json"
          python deployment/scripts/release_manifest.py build \
            --output "$manifest" \
            --image-reference "$PUBLISHED_IMAGE_REFERENCE" \
            --image-digest "$PUBLISHED_IMAGE_DIGEST" \
            --image-id "$PUBLISHED_IMAGE_ID" \
            --image-revision "$SENTINEL_DNA_AUTHORIZED_RELEASE_SHA" \
            --image-source "https://github.com/uwakwechukwuebukapaul-ai/SENTINEL-DNA" \
            --image-created "$SENTINEL_DNA_IMAGE_CREATED"
          echo "IMAGE_BOUND_MANIFEST_PATH=$manifest" >> "$GITHUB_ENV"

      - name: Verify image-bound release manifest
        shell: bash
        run: |
          set -euo pipefail
          python deployment/scripts/release_manifest.py verify \
            --manifest "$IMAGE_BOUND_MANIFEST_PATH" \
            --require-image \
            --expected-release-sha "$SENTINEL_DNA_AUTHORIZED_RELEASE_SHA" \
            --expected-image-digest "$PUBLISHED_IMAGE_DIGEST"

      - name: Upload non-secret image release evidence
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-dna-gate2-image-evidence-${{ vars.SENTINEL_DNA_AUTHORIZED_RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/sentinel-dna-image-provenance.json
            ${{ runner.temp }}/sentinel-dna-release-manifest-image-bound.json
