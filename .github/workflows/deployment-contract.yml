name: deployment-contract-blocked

on:
  workflow_dispatch:

# Emergency containment proposal.
# This branch is not the default branch; this change does not contain main
# until reviewed and merged or the workflow is disabled in repository settings.
permissions: {}

jobs:
  blocked:
    name: Fail closed — independent release trust root unavailable
    runs-on: ubuntu-latest
    steps:
      - name: Refuse all release and publication activity
        shell: bash
        run: |
          echo "::error title=Release blocked::This repository workflow has no independent trust root or release authorization."
          exit 1
