name: production-gates

on:
  push:
    branches: ["feature/investigator-v1.4-production-hardening", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q app services dashboard config database deployment
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt
      - name: Validate production Compose topology
        env:
          SENTINEL_DNA_SECRET_KEY: ci-only-secret-key-must-be-long-enough-123456
          POSTGRES_PASSWORD: ci-only-postgres-password
        run: docker compose -f deployment/docker-compose.yml config --quiet
      - run: python -m deployment.production.readiness
      - run: python -m pytest tests/security tests/production -q
      - run: python -m playwright install --with-deps chromium
      - name: Browser certification after browser install
        run: python -m pytest tests/browser -q
      - run: python -m pytest -q
      - run: git diff --check

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag sentinel-dna:production-certification .
      - name: Validate production Compose topology
        env:
          SENTINEL_DNA_SECRET_KEY: ci-only-secret-key-must-be-long-enough-123456
          POSTGRES_PASSWORD: ci-only-postgres-password
        run: docker compose -f deployment/docker-compose.yml config --quiet
      - name: Run health, readiness, identity, and shutdown smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name sentinel-dna-production-certification --publish 5000:5000 \
            --env SENTINEL_DNA_ENV=production \
            --env SENTINEL_DNA_SECRET_KEY=ci-only-secret-key-must-be-long-enough-123456 \
            --env SENTINEL_DNA_SECURE_COOKIES=1 \
            --env SENTINEL_DNA_DB_PATH=/var/lib/sentinel/soc.db \
            sentinel-dna:production-certification
          trap 'docker rm --force sentinel-dna-production-certification >/dev/null 2>&1 || true' EXIT
          health_ok=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then health_ok=true; break; fi
            sleep 2
          done
          if [ "$health_ok" != "true" ]; then
            docker logs sentinel-dna-production-certification
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:5000/ready
          for attempt in {1..45}; do
            health_status="$(docker inspect --format '{{.State.Health.Status}}' sentinel-dna-production-certification)"
            if [ "$health_status" = "healthy" ]; then break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' sentinel-dna-production-certification)" = "healthy"
          test "$(docker exec sentinel-dna-production-certification id -u)" = "10001"
          docker stop --time 15 sentinel-dna-production-certification
