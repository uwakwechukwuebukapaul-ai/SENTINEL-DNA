server {
  listen 80;
  client_max_body_size 10m;
  location / { proxy_pass http://app:5000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /health { proxy_pass http://app:5000/health; access_log off; }
  location = /ready { proxy_pass http://app:5000/ready; access_log off; }
}
