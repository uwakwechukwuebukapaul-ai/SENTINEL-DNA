server {
  listen 80;
  server_name sentinel-dna-staging 192.168.1.115 127.0.0.1;
  return 308 https://$host:8443$request_uri;
}

server {
  listen 443 ssl;
  server_name sentinel-dna-staging 192.168.1.115 127.0.0.1;
  client_max_body_size 10m;

  ssl_certificate /etc/nginx/tls/staging.crt;
  ssl_certificate_key /etc/nginx/tls/staging.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://app:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
  }

  location = /health {
    proxy_pass http://app:5000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
    access_log off;
  }

  location = /ready {
    proxy_pass http://app:5000/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
    access_log off;
  }
}
