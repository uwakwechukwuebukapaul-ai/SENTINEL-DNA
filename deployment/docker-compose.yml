services:
  migration:
    image: deployment-app:${SENTINEL_DNA_IMAGE_TAG:?set SENTINEL_DNA_IMAGE_TAG}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VCS_REF: ${SENTINEL_DNA_IMAGE_REVISION_FULL:?set SENTINEL_DNA_IMAGE_REVISION_FULL}
        VCS_REF_FULL: ${SENTINEL_DNA_IMAGE_REVISION_FULL:?set SENTINEL_DNA_IMAGE_REVISION_FULL}
        IMAGE_VERSION: ${SENTINEL_DNA_IMAGE_TAG:?set SENTINEL_DNA_IMAGE_TAG}
        IMAGE_SOURCE: ${SENTINEL_DNA_IMAGE_SOURCE:-https://github.com/uwakwechukwuebukapaul-ai/SENTINEL-DNA}
        IMAGE_CREATED: ${SENTINEL_DNA_IMAGE_CREATED:?set SENTINEL_DNA_IMAGE_CREATED}
    command: ["python", "-m", "database.run_migrations"]
    restart: "no"
    environment:
      SENTINEL_DNA_ENV: production
      SENTINEL_DNA_SECRET_KEY: ${SENTINEL_DNA_SECRET_KEY:?set SENTINEL_DNA_SECRET_KEY}
      SENTINEL_DNA_IMAGE_DIGEST: ${SENTINEL_DNA_IMAGE_DIGEST:?set SENTINEL_DNA_IMAGE_DIGEST}
      SENTINEL_DNA_GATE1_TRUSTED_METADATA_PATH: /run/sentinel/release/metadata.json
      SENTINEL_DNA_SECURE_COOKIES: "1"
      SENTINEL_DNA_DB_PATH: /var/lib/sentinel/soc.db
      DATABASE_URL: postgresql://sentinel@postgres:5432/sentinel_dna
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - type: bind
        source: ${SENTINEL_DNA_GATE1_TRUSTED_METADATA_FILE:?set SENTINEL_DNA_GATE1_TRUSTED_METADATA_FILE}
        target: /run/sentinel/release/metadata.json
        read_only: true

  app:
    image: deployment-app:${SENTINEL_DNA_IMAGE_TAG:?set SENTINEL_DNA_IMAGE_TAG}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VCS_REF: ${SENTINEL_DNA_IMAGE_REVISION_FULL:?set SENTINEL_DNA_IMAGE_REVISION_FULL}
        VCS_REF_FULL: ${SENTINEL_DNA_IMAGE_REVISION_FULL:?set SENTINEL_DNA_IMAGE_REVISION_FULL}
        IMAGE_VERSION: ${SENTINEL_DNA_IMAGE_TAG:?set SENTINEL_DNA_IMAGE_TAG}
        IMAGE_SOURCE: ${SENTINEL_DNA_IMAGE_SOURCE:-https://github.com/uwakwechukwuebukapaul-ai/SENTINEL-DNA}
        IMAGE_CREATED: ${SENTINEL_DNA_IMAGE_CREATED:?set SENTINEL_DNA_IMAGE_CREATED}
    environment:
      SENTINEL_DNA_ENV: production
      SENTINEL_DNA_SECRET_KEY: ${SENTINEL_DNA_SECRET_KEY:?set SENTINEL_DNA_SECRET_KEY}
      SENTINEL_DNA_IMAGE_DIGEST: ${SENTINEL_DNA_IMAGE_DIGEST:?set SENTINEL_DNA_IMAGE_DIGEST}
      SENTINEL_DNA_GATE1_TRUSTED_METADATA_PATH: /run/sentinel/release/metadata.json
      SENTINEL_DNA_SECURE_COOKIES: "1"
      SENTINEL_DNA_DB_PATH: /var/lib/sentinel/soc.db
      DATABASE_URL: postgresql://sentinel@postgres:5432/sentinel_dna
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - sentinel-data:/var/lib/sentinel
      - type: bind
        source: ${SENTINEL_DNA_GATE1_TRUSTED_METADATA_FILE:?set SENTINEL_DNA_GATE1_TRUSTED_METADATA_FILE}
        target: /run/sentinel/release/metadata.json
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel_dna
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [sentinel-postgres:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_dna"], interval: 10s, timeout: 5s, retries: 5}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [sentinel-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app: {condition: service_healthy}
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${SENTINEL_DNA_TLS_DIR:?set SENTINEL_DNA_TLS_DIR}
        target: /etc/nginx/tls
        read_only: true
volumes:
  sentinel-data:
  sentinel-postgres:
  sentinel-redis:
