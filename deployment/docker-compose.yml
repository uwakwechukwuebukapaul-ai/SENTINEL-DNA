services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      SENTINEL_DNA_ENV: production
      SENTINEL_DNA_SECRET_KEY: ${SENTINEL_DNA_SECRET_KEY:?set SENTINEL_DNA_SECRET_KEY}
      SENTINEL_DNA_SECURE_COOKIES: "1"
      SENTINEL_DNA_DB_PATH: /var/lib/sentinel/soc.db
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["5000:5000"]
    volumes: [sentinel-data:/var/lib/sentinel]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel_dna
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [sentinel-postgres:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_dna"], interval: 10s, timeout: 5s, retries: 5}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [sentinel-redis:/data]
  nginx:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports: ["80:80"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
volumes:
  sentinel-data:
  sentinel-postgres:
  sentinel-redis:
