services:
  edge:
    image: ${SENTINEL_DNA_STAGING_EDGE_IMAGE:?set external staging edge image}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "0.0.0.0:8443:443"
    volumes:
      - type: bind
        source: ${SENTINEL_DNA_STAGING_EDGE_CONFIG_FILE:?set external edge configuration}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${SENTINEL_DNA_STAGING_TLS_DIR:?set external staging TLS directory}
        target: /etc/nginx/tls
        read_only: true
    networks:
      - staging_edge

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["gunicorn", "wsgi:application", "--bind", "0.0.0.0:5000", "--workers", "1", "--access-logfile", "-", "--error-logfile", "-"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - "5000"
    environment:
      SENTINEL_DNA_ENV: staging
      SENTINEL_DNA_PILOT_ACCESS_REQUIRED: "1"
      SENTINEL_DNA_SECURE_COOKIES: "1"
      FLASK_DEBUG: "0"
      SENTINEL_DNA_CONFIG_SOURCE_CLASSIFICATION: external_non_production
      SENTINEL_DNA_DATABASE_TARGET_CLASSIFICATION: disposable_staging
      SENTINEL_DNA_SECRET_KEY: ${SENTINEL_DNA_SECRET_KEY:?set external non-production secret}
      SENTINEL_DNA_DB_PATH: /var/lib/sentinel/staging/soc.db
      DATABASE_URL: postgresql://sentinel@postgres:5432/sentinel_dna
      PGPASSWORD: ${SENTINEL_DNA_POSTGRES_PASSWORD:?set external disposable staging password}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staging_app_data:/var/lib/sentinel
    networks:
      - staging_edge
      - staging_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3

  migration:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["python", "-m", "database.run_migrations"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SENTINEL_DNA_ENV: staging
      SENTINEL_DNA_PILOT_ACCESS_REQUIRED: "1"
      SENTINEL_DNA_SECURE_COOKIES: "1"
      FLASK_DEBUG: "0"
      SENTINEL_DNA_CONFIG_SOURCE_CLASSIFICATION: external_non_production
      SENTINEL_DNA_DATABASE_TARGET_CLASSIFICATION: disposable_staging
      SENTINEL_DNA_SECRET_KEY: ${SENTINEL_DNA_SECRET_KEY:?set external non-production secret}
      SENTINEL_DNA_DB_PATH: /var/lib/sentinel/staging/soc.db
      DATABASE_URL: postgresql://sentinel@postgres:5432/sentinel_dna
      PGPASSWORD: ${SENTINEL_DNA_POSTGRES_PASSWORD:?set external disposable staging password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging_internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel_dna
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${SENTINEL_DNA_POSTGRES_PASSWORD:?set external disposable staging password}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    networks:
      - staging_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_dna"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - staging_redis_data:/data
    networks:
      - staging_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  staging_edge:
  staging_internal:
    internal: true

volumes:
  staging_app_data:
  staging_postgres_data:
  staging_redis_data:
