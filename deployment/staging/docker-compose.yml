services:
  edge:
    image: ${SENTINEL_DNA_STAGING_EDGE_IMAGE:?set external staging edge image}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "0.0.0.0:8443:443"
    volumes:
      - type: bind
        source: ${SENTINEL_DNA_STAGING_EDGE_CONFIG_FILE:?set external edge configuration}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${SENTINEL_DNA_STAGING_TLS_DIR:?set external staging TLS directory}
        target: /etc/nginx/tls
        read_only: true
    networks:
      - staging_edge

  app:
    image: staging-app:${SENTINEL_DNA_IMAGE_TAG:?set SENTINEL_DNA_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VCS_REF: ${SENTINEL_DNA_IMAGE_REVISION_FULL:?set SENTINEL_DNA_IMAGE_REVISION_FULL}
        VCS_REF_FULL: ${SENTINEL_DNA_IMAGE_REVISION_FULL:?set SENTINEL_DNA_IMAGE_REVISION_FULL}
        IMAGE_VERSION: ${SENTINEL_DNA_IMAGE_TAG:?set SENTINEL_DNA_IMAGE_TAG}
        IMAGE_SOURCE: https://github.com/uwakwechukwuebukapaul-ai/SENTINEL-DNA
        IMAGE_CREATED: ${SENTINEL_DNA_IMAGE_CREATED:?set SENTINEL_DNA_IMAGE_CREATED}
    command: ["gunicorn", "wsgi:application", "--bind", "0.0.0.0:5000", "--workers", "1", "--access-logfile", "-", "--error-logfile", "-"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - "5000"
    environment:
      SENTINEL_DNA_ENV: staging
      SENTINEL_DNA_PILOT_ACCESS_REQUIRED: "1"
      SENTINEL_DNA_SECURE_COOKIES: "1"
      FLASK_DEBUG: "0"
      SENTINEL_DNA_CONFIG_SOURCE_CLASSIFICATION: external_non_production
      SENTINEL_DNA_DATABASE_TARGET_CLASSIFICATION: disposable_staging
      SENTINEL_DNA_SECRET_KEY_FILE: /run/secrets/sentinel_dna_secret_key
      # The named volume is mounted at /var/lib/sentinel. Keep the SQLite
      # compatibility path at that mount root; staging's authoritative
      # backend remains the private PostgreSQL DATABASE_URL below.
      SENTINEL_DNA_DB_PATH: /var/lib/sentinel/soc.db
      DATABASE_URL: postgresql://sentinel@postgres:5432/sentinel_dna
      SENTINEL_DNA_POSTGRES_PASSWORD_FILE: /run/secrets/sentinel_dna_postgres_password
      REDIS_URL: redis://redis:6379/0
    secrets:
      - source: staging_app_secret_key
        target: sentinel_dna_secret_key
      - source: staging_postgres_password
        target: sentinel_dna_postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staging_app_data:/var/lib/sentinel
    networks:
      - staging_edge
      - staging_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3

  migration:
    image: staging-app:${SENTINEL_DNA_IMAGE_TAG:?set SENTINEL_DNA_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VCS_REF: ${SENTINEL_DNA_IMAGE_REVISION_FULL:?set SENTINEL_DNA_IMAGE_REVISION_FULL}
        VCS_REF_FULL: ${SENTINEL_DNA_IMAGE_REVISION_FULL:?set SENTINEL_DNA_IMAGE_REVISION_FULL}
        IMAGE_VERSION: ${SENTINEL_DNA_IMAGE_TAG:?set SENTINEL_DNA_IMAGE_TAG}
        IMAGE_SOURCE: https://github.com/uwakwechukwuebukapaul-ai/SENTINEL-DNA
        IMAGE_CREATED: ${SENTINEL_DNA_IMAGE_CREATED:?set SENTINEL_DNA_IMAGE_CREATED}
    command: ["python", "-m", "database.run_migrations"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SENTINEL_DNA_ENV: staging
      SENTINEL_DNA_PILOT_ACCESS_REQUIRED: "1"
      SENTINEL_DNA_SECURE_COOKIES: "1"
      FLASK_DEBUG: "0"
      SENTINEL_DNA_CONFIG_SOURCE_CLASSIFICATION: external_non_production
      SENTINEL_DNA_DATABASE_TARGET_CLASSIFICATION: disposable_staging
      SENTINEL_DNA_SECRET_KEY_FILE: /run/secrets/sentinel_dna_secret_key
      SENTINEL_DNA_DB_PATH: /var/lib/sentinel/soc.db
      DATABASE_URL: postgresql://sentinel@postgres:5432/sentinel_dna
      SENTINEL_DNA_POSTGRES_PASSWORD_FILE: /run/secrets/sentinel_dna_postgres_password
    secrets:
      - source: staging_app_secret_key
        target: sentinel_dna_secret_key
      - source: staging_postgres_password
        target: sentinel_dna_postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging_internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel_dna
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD_FILE: /run/secrets/sentinel_dna_postgres_password
    secrets:
      - source: staging_postgres_password
        target: sentinel_dna_postgres_password
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    networks:
      - staging_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_dna"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - staging_redis_data:/data
    networks:
      - staging_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  staging_edge:
  staging_internal:
    internal: true

secrets:
  staging_app_secret_key:
    environment: SENTINEL_DNA_SECRET_KEY
  staging_postgres_password:
    environment: SENTINEL_DNA_POSTGRES_PASSWORD

volumes:
  staging_app_data:
  staging_postgres_data:
  staging_redis_data:
