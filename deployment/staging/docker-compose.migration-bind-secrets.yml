services:
  migration:
    # Remove the base service's Compose secrets for this migration-only path.
    secrets: []
    volumes:
      - type: bind
        source: ${SENTINEL_DNA_MIGRATION_SECRET_KEY_FILE:?set Linux-native migration secret key file}
        target: /run/secrets/sentinel_dna_secret_key
        read_only: true
      - type: bind
        source: ${SENTINEL_DNA_MIGRATION_POSTGRES_PASSWORD_FILE:?set Linux-native migration PostgreSQL password file}
        target: /run/secrets/sentinel_dna_postgres_password
        read_only: true
