server {
  listen 80;
  server_name _;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name uwakwe-desktop.taile388cc.ts.net sentinel-dna-staging;
  client_max_body_size 10m;

  ssl_certificate /etc/nginx/tls/staging-server.crt;
  ssl_certificate_key /etc/nginx/tls/staging-server.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://app:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
  }

  location = /health {
    proxy_pass http://app:5000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
    access_log off;
  }

  location = /ready {
    proxy_pass http://app:5000/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
    access_log off;
  }
}
