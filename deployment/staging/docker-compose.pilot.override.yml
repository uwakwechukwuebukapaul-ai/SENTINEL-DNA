# Controlled analyst pilot override.
# The base staging profile owns service isolation and external secret mounts.
# Bind the only host-published surface to loopback; remote access must use an
# approved VPN, zero-trust tunnel, or operator-controlled port forward.
services:
  app:
    image: ${SENTINEL_DNA_PILOT_IMAGE_REFERENCE:?set inspected pilot image reference}
    build: null

  migration:
    image: ${SENTINEL_DNA_PILOT_IMAGE_REFERENCE:?set inspected pilot image reference}
    build: null

  edge:
    ports:
      - "127.0.0.1:8443:443"

secrets:
  staging_app_secret_key:
    file: ${SENTINEL_DNA_STAGING_APP_SECRET_FILE:?set external application secret file}
  staging_postgres_password:
    file: ${SENTINEL_DNA_STAGING_POSTGRES_PASSWORD_FILE:?set external database secret file}
