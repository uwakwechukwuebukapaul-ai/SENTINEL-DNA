# Controlled analyst pilot override.
# The base staging profile owns service isolation and external secret mounts.
# The base staging profile publishes the TLS edge only on loopback; remote
# access must use an approved VPN, zero-trust tunnel, or operator-controlled
# port forward.
services:
  app:
    image: ${SENTINEL_DNA_PILOT_IMAGE_REFERENCE:?set inspected pilot image reference}
    build: !reset null

  migration:
    image: ${SENTINEL_DNA_PILOT_IMAGE_REFERENCE:?set inspected pilot image reference}
    build: !reset null
